<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoidVanguard - Jelszóvisszaállítás</title>
  </head>
  <body>
    <template id="content">
      <h1>Jelszóvisszaállítás</h1>
      <password-reset-form></password-reset-form>
    </template>

    <script type="module">
      import "/ui/component/auth/PasswordResetForm.js";
      import { autologin } from "/common/common.js";

      (async () => {
        if (await autologin()) {
          window.location.href = "/";
          return;
        }

        const template = document.querySelector("#content");
        const fragment = template.content.cloneNode(true);

        document.body.appendChild(fragment);
      })();
    </script>
  </body>
</html>
