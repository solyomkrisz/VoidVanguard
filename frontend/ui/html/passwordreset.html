<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoidVanguard - Jelszóvisszaállítás</title>
    <link rel="stylesheet" href="/ui/style/passwordreset.css" />
  </head>
  <body>
    <canvas id="stars"></canvas>

    <div class="page-wrapper">
      <img src="/image/VoidVanguardTitlePixelart.png" alt="VoidVanguard" class="title-image" />
      <template id="content">
        <password-reset-form></password-reset-form>
      </template>
      <p id="token-invalid-msg" hidden>Érvénytelen vagy lejárt visszaállítási link.</p>
    </div>

    <script>
      const canvas = document.getElementById("stars");
      const ctx = canvas.getContext("2d");
      const stars = [];
      const STAR_COUNT = 120;

      function createStars() {
        stars.length = 0;
        for (let i = 0; i < STAR_COUNT; i++) {
          const star = {
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() < 0.75 ? 1 : 2,
            opacity: Math.random(),
            delta: Math.random() * 0.003 + 0.001,
          };
          if (Math.random() < 0.5) star.delta = -star.delta;
          stars.push(star);
        }
      }

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        createStars();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const star of stars) {
          star.opacity += star.delta;
          if (star.opacity <= 0 || star.opacity >= 1) star.delta = -star.delta;
          ctx.fillStyle = "rgba(190,215,255," + star.opacity.toFixed(2) + ")";
          ctx.fillRect(star.x, star.y, star.size, star.size);
        }
        requestAnimationFrame(draw);
      }

      resize();
      draw();
      window.addEventListener("resize", resize);
    </script>

    <script type="module">
      import "/ui/component/auth/PasswordResetForm.js";
      import { autologin } from "/common/common.js";

      (async () => {
        if (await autologin()) {
          window.location.href = "/";
          return;
        }

        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        const wrapper = document.querySelector(".page-wrapper");
        const template = document.querySelector("#content");
        const invalidMsg = document.getElementById("token-invalid-msg");

        if (!token) {
          invalidMsg.hidden = false;
          return;
        }

        const fragment = template.content.cloneNode(true);
        wrapper.insertBefore(fragment, invalidMsg);
      })();
    </script>
  </body>
</html>
