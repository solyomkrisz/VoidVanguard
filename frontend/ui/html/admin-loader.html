<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoidVanguard - Adminisztrációs felület</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        animation: adminShellRise 420ms ease-out both;
      }

      admin-loader {
        width: 100%;
        height: 100vh;
        display: block;
        animation: adminItemRise 420ms ease-out 120ms both;
      }

      iframe {
        height: 100vh !important;
        display: block;
        animation: adminItemRise 360ms ease-out 220ms both;
      }

      @keyframes adminShellRise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes adminItemRise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <admin-loader></admin-loader>

    <script type="module">
      import "/ui/component/admin/AdminLoader.js";
    </script>
  </body>
</html>
