<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teszt 2</title>
    <script type="module">
      import Polyester from "./ui/component/v2/Define.js";

      const MyElement = Polyester({
        is: "my-element",
        parsingMethod: "element",
        properties: {
          dataAsd: {
            type: String,
          },
          firstName: {
            type: String,
            value: "a",
          },
          address: {
            type: String,
            value: {
              street: {
                name: "utca 1",
              },
            },
          },
          lastName: String,
          fullName: {
            computed: "computeFullName(firstName, lastName)",
          },
          greeting: "createGreetingMessage(fullName)",
          show: {
            type: Boolean,
            value: false,
          },
          show2: {
            type: Boolean,
            value: false,
          },
        },
        test: function () {
          console.log(this, "<my-element> test");
        },
        computeFullName: function (firstName, lastName) {
          return firstName + " " + lastName;
        },
        createGreetingMessage: function (fullName) {
          return `Szia, ${fullName}! Üdvözöllek!`;
        },
        template: `
          <div class="[[id]]">
            Vezetéknév: [[firstName]]<br />
            Keresztnév: [[lastName]]<br />
            Utca név: [[address.street.name]]
          </div>
          <template is="dom-if" if="[[show]]">
            <h1>Hello [[firstName]]</h1>
            <template is="dom-if" if="[[show2]]">
              <h1>[[lastName]]</h1>  
            </template>
          </template>
          <br/>
        `,
      });

      console.log(MyElement.__bindings);

      // console.log(MyElement.prototype);
    </script>
  </head>
  <body>
    <my-element id="_1">
      <template>
        <span>
          <div>Utca: <span>[[address.street.name]]</span></div>
          <span>[[greeting]]</span>
        </span>

        <my-element
          last-name$="[[lastName]]"
          first-name$="[[firstName]]"
          id="_2"
        >
          <template>
            <div>Vezetéknév: <span>[[lastName]]</span></div>
            <div>Keresztnév: <span>[[firstName]]</span></div>
            <div><span>Teljes név: </span><span>[[fullName]]</span></div>
          </template>
        </my-element>
      </template>
    </my-element>

    <my-element id="test"></my-element>

    <script type="module">
      const el2 = document.querySelector("#_2");
      const el1 = document.querySelector("#_1");
      const test = document.querySelector("#test");

      test.lastName = "HALO!";

      document.addEventListener("color-changed", (e) => {
        console.log(e.target, e.detail);
      });

      el1.lastName = "Géza";
      el1.firstName = "Jani";

      console.log(el1.address);

      /*
        HA NINCS INICIALICÁZIÓ:

        - Minden computed property dirty = true marad, mert soha nem lesz kiszámítva
        - Ha módosítok bármilyen nem computed property-t amitől függ computed property: mivel dirty = true nem lesz megint megjelölve dirtynek
        - A DOM update csak akkor fut le ha valami dirty-nek megjelölésre kerül, de mivel a dirty = true nem léptet be az if-be így az nem fut le
        - Ha esetleg valahol lefuttatjuk a getter-t majd megváltoztatjuk az egyik proprty-t amitől függ az adott computed property akkor mivel a getter
        dirty = false-ra állította a computed.dirty-t ezért már lefut és módosítja a DOM-ot
        - Ha egy computed property-től függ egy másik, de a másiknak nem lett soha meghívva a getterje a dirty-je true, vagyis ha a computed prop
        amitől függ meg is lesz jelölve dirtynek és ő meg akarja jelölni az összes többi ami tőle függ, az összes többi közül csak az fut le aminek
        a getterje már meg lett hívva, hisz ellenkező esetben dirty = true
      */

      setTimeout(() => {
        el1.show = true;
        test.show = true;
        console.log("TEST SHOW 2000ms: ", test.show);
      }, 2000);

      setTimeout(() => {
        // test.show = true;
        console.log("TEST SHOW: ", test.show);
      }, 3000);

      setTimeout(() => {
        el1.firstName = "Géza";
        el1.show2 = true;
      }, 5000);
    </script>
  </body>
</html>
