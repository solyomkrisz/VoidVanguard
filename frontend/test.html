<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoidVanguard</title>
    <style>
      body {
        margin: 0;
        background: #00f;
        overflow: hidden;
      }

      .container {
        min-width: 100vh;
        display: flex;
      }

      .container > * {
        width: 100%;
      }

      form {
        background: #000;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }

      #regFormError {
        color: red;
      }

      a {
        color: #000 !important;
      }
    </style>
  </head>
  <body>
    <state-provider>
      <state-provider
        as="user"
        src="/api/sessions"
        method="POST"
      ></state-provider>
      <state-provider
        as="profile"
        state="user"
        subscribe-to="id"
        subscribe-with="src"
        src-prefix="/api/profiles/"
      ></state-provider>
      <div state="user" subscribe-to="id" subscribe-with="textContent"></div>
      <a
        state="profile"
        subscribe-to="user_id"
        subscribe-with="href"
        href="/profile/create"
        >Profil</a
      >

      <!-- <render-if multistatesubscribe when="!user.id">
        <h2>HELLO!</h2>
      </render-if> -->

      <!-- account quick manager -->
      <div>
        <span state="user" subscribe-to="username">Logged out</span>
        <render-if state="user" when="local.id">
          <render-if state="profile" when="console.log(local.user_id)">
            <a state="profile" subscribe-to="user_id" subscribe-with="href"
              >Profil megtekintése</a
            >
          </render-if>
          <render-if state="profile" when="!local.user_id">
            <a href="/profile/create">Profil létrehozása</a>
          </render-if>
        </render-if>
      </div>
    </state-provider>

    <account-quick-manager></account-quick-manager>
    <account-quick-manager></account-quick-manager>

    <div class="container">
      <div>
        <form id="regForm">
          <label for="username">Felhasználónév</label>
          <input autocomplete="off" name="username" id="username" type="text" />
          <label for="email">Email</label>
          <input autocomplete="off" name="email" id="email" type="email" />
          <label for="password">Jelszó</label>
          <input
            autocomplete="off"
            name="password"
            id="password"
            type="password"
          />
          <label for="passwordConfirm">Jelszó megerősítése</label>
          <input
            autocomplete="off"
            name="passwordConfirm"
            id="passwordConfirm"
            type="password"
          />
          <div style="display: flex">
            <div>
              <label for="male">Férfi</label>
              <input name="gender" type="radio" id="male" value="0" />
            </div>
            <div>
              <label for="female">Nő</label>
              <input name="gender" type="radio" id="female" value="1" />
            </div>
          </div>
          <button>Regisztráció</button>
          <div id="regFormMsg"></div>
        </form>
      </div>

      <div>
        <form id="logForm">
          <label for="username">Felhasználónév</label>
          <input autocomplete="off" name="username" id="username" type="text" />
          <label for="password">Jelszó</label>
          <input
            autocomplete="off"
            name="password"
            id="password"
            type="password"
          />
          <button>Bejelentkezés</button>
          <div id="logFormMsg"></div>
        </form>
      </div>

      <logout-button></logout-button>
    </div>

    <form id="reqDataForm">
      <button>Request protected resource</button>
    </form>

    <script type="module" src="./ui/initcomponents.js"></script>
    <script type="module">
      import * as net from "./common/network.js";
      import * as jwt from "./common/jwt.js";
      import { extractForm, onDOMContentLoaded } from "./common/common.js";
      import * as UI from "./ui/UI.js";
      import userState from "./state/user.js";

      //
      // const rsp2 = document.querySelector("state-provider[as='profile']");
      // console.log(rsp2);
      // rsp2.src = "/api/profiles/1ac13e29-01d7-437a-93bd-d633304b482a";
      //

      document.addEventListener("DOMContentLoaded", onDOMContentLoaded);

      setTimeout(() => {
        document.body.appendChild(UI.element("account-quick-manager"));
      }, 1000);

      console.log(
        jwt.isExpired(
          "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJiZWVlMTY4YS1hZjFkLTQxMzYtYTBmNi00ZGE1M2QxODlmMmQiLCJ1c2VybmFtZSI6ImFhYSIsInJvbGVzIjpbbnVsbF0sImlhdCI6MTc3MDUxMjEwNCwiZXhwIjoxNzcwNTEzMDA0fQ.AF9V4axelZ0FTR-zP3wmgsORWEYdqQytrHIFj7n6agg",
        ),
      );

      document
        .querySelector("#regForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const result = await net.send("/api/users", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(extractForm(e.srcElement)),
          });

          if (result.message) {
            const regFormMsg = document.querySelector("#regFormMsg");
            if (!result.success) {
              regFormMsg.style.color = "red";
            } else regFormMsg.style.color = "green";
            regFormMsg.textContent = result.message;
          }
        });

      document
        .querySelector("#logForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const result = await net.send("/api/sessions", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${localStorage.getItem("access_token")}`,
            },
            body: JSON.stringify(extractForm(e.srcElement)),
          });

          if (result.message) {
            const regFormMsg = document.querySelector("#logFormMsg");
            if (!result.success) {
              regFormMsg.style.color = "red";
            } else {
              regFormMsg.style.color = "green";
              if (result.result?.access_token) {
                localStorage.setItem(
                  "access_token",
                  result.result.access_token,
                );

                const decoded = jwt.decode(result?.result?.access_token);

                console.log(
                  "Access token set: ",
                  localStorage.getItem("access_token"),
                );

                // document.dispatchEvent(new CustomEvent("login"));
                userState.from(decoded);
              }
            }
            regFormMsg.textContent = result.message;
          }
        });
    </script>

    <script>
      // const rsp = document.querySelector("state-provider");
      // console.log(rsp);
      // rsp.src = "/api/sessions";
    </script>
  </body>
</html>
