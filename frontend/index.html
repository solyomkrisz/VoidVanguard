<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoidVanguard</title>
    <script>if (localStorage.getItem('access_token')) document.documentElement.classList.add('has-token');</script>
    <link rel="stylesheet" href="/ui/style/global.css" />
    <link rel="stylesheet" href="/ui/style/game.css" />
    <link rel="stylesheet" href="/ui/style/index.css" />
    <link rel="stylesheet" href="/ui/style/toasts.css" />
  </head>
  <body>
    <div id="authContainer">
      <canvas id="stars"></canvas>
      <img src="/image/VoidVanguardTitlePixelart.png" alt="VoidVanguard" class="title-image" />
      <div class="auth-forms">
        <form id="regForm">
          <h2>Regisztráció</h2>
          <label for="reg-username">Felhasználónév</label>
          <username-input-validator disable-on-invalid="#register-button" validate-immediately>
            <input autocomplete="off" name="username" id="reg-username" type="text" required />
          </username-input-validator>
          <label for="reg-email">Email</label>
          <email-input-validator disable-on-invalid="#register-button" validate-immediately>
            <input autocomplete="off" name="email" id="reg-email" type="email" required />
          </email-input-validator>
          <label for="reg-password">Jelszó</label>
          <password-input-validator disable-on-invalid="#register-button" validate-immediately>
            <input autocomplete="off" name="password" id="reg-password" type="password" required />
          </password-input-validator>
          <label for="reg-passwordConfirm">Jelszó megerősítése</label>
          <password-input-validator disable-on-invalid="#register-button" validate-immediately>
            <input autocomplete="off" name="passwordConfirm" id="reg-passwordConfirm" type="password" required />
          </password-input-validator>
          <button type="submit" id="register-button" data-sfx="click_1">Regisztráció</button>
          <div id="regFormMsg" class="form-message"></div>
          <a data-sfx="click_1">Van már fiókod? Jelentkezz be itt!</a>
        </form>

        <form id="logForm">
          <h2>Bejelentkezés</h2>
          <label for="log-username">Felhasználónév</label>
          <input autocomplete="off" name="username" id="log-username" type="text" required />
          <label for="log-password">Jelszó</label>
          <input autocomplete="off" name="password" id="log-password" type="password" required />
          <button type="submit" data-sfx="click_1">Bejelentkezés</button>
          <div id="logFormMsg" class="form-message"></div>
          <a data-sfx="click_1">Nincs fiókod? Regisztrálj!</a>
          <a id="forgotPasswordLink" data-sfx="click_1">Elfelejtettem a jelszavam!</a>
        </form>
        <password-reset-request-form id="forgotPasswordForm" style="display:none"></password-reset-request-form>
      </div>
    </div>

    <div id="gameMenu" class="hidden">
      <canvas id="gameStars"></canvas>
      <img src="/image/VoidVanguardTitlePixelart.png" alt="VoidVanguard" class="title-image" />
      <div id="gameMenuPanel">
        <div id="gameMenuMain">
          <h2>Főmenü</h2>
          <button id="newGameBtn" data-sfx="click_1">Új játék indítása</button>
          <button id="loadGameBtn" data-sfx="click_1">Játékmenet betöltése</button>
          <button id="leaderboardBtn" data-sfx="click_1">Ranglétra</button>
          <button id="adminPanelBtn" hidden data-sfx="click_1">Admin panel</button>
          <button id="gameMenuLogoutBtn" data-sfx="click_1">Kijelentkezés</button>
        </div>
        <div id="gameMenuLoad" class="hidden">
          <h2>Játékmenet betöltése</h2>
          <div id="gameMenuSaveSlot"></div>
          <button id="backBtn" data-sfx="click_1">Vissza</button>
        </div>
      </div>
    </div>

    <button id="settingsBtn" data-sfx="click_1">
      <img src="/image/SettingsButton.png" alt="Settings" />
    </button>

     <button id="friendsBtn" data-sfx="click_1">
       <img src="/image/FriendsButton.png" alt="Friends" />
     </button>

    <div id="settingsPanel">
      <label><input type="checkbox" id="toggleNebula" checked /> Nebula</label>
      <label><input type="checkbox" id="toggleChunkDebug" checked /> Chunk Debug</label>
      <label><input type="checkbox" id="toggleGridCells" checked /> Grid Cells</label>
      <label><input type="checkbox" id="toggleEntityIds" checked /> Entity IDs</label>
      <label><input type="checkbox" id="toggleSpaceshipCircle" checked /> Spaceship Circle</label>
      <label><input type="checkbox" id="toggleSpaceshipHitbox" checked /> Spaceship Hitbox</label>
      <ui-volume-controller></ui-volume-controller>
      <game-volume-controller></game-volume-controller>
    </div>

    <toast-manager event-controlled></toast-manager>

    <script type="module" src="/ui/initcomponents.js"></script>
    <script>
      const authCanvas = document.getElementById("stars");
      const authCtx = authCanvas.getContext("2d");
      const authStars = [];
      const gameCanvas = document.getElementById("gameStars");
      const gameCtx = gameCanvas.getContext("2d");
      const gameStars = [];
      const STAR_COUNT = 120;

      function createStarsForCanvas(canvas, stars) {
        stars.length = 0;
        for (let i = 0; i < STAR_COUNT; i++) {
          const star = {
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() < 0.75 ? 1 : 2,
            opacity: Math.random(),
            delta: Math.random() * 0.003 + 0.001,
          };
          if (Math.random() < 0.5) {
            star.delta = -star.delta;
          }
          stars.push(star);
        }
      }

      function resizeStarsCanvas() {
        authCanvas.width = window.innerWidth;
        authCanvas.height = window.innerHeight;
        gameCanvas.width = window.innerWidth;
        gameCanvas.height = window.innerHeight;
        createStarsForCanvas(authCanvas, authStars);
        createStarsForCanvas(gameCanvas, gameStars);
      }

      resizeStarsCanvas();

      function drawStars(ctx, canvas, stars) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (const star of stars) {
          star.opacity += star.delta;

          if (star.opacity <= 0 || star.opacity >= 1) {
            star.delta = -star.delta;
          }

          ctx.fillStyle = "rgba(190, 215, 255, " + star.opacity.toFixed(2) + ")";
          ctx.fillRect(star.x, star.y, star.size, star.size);
        }
      }

      function draw() {
        drawStars(authCtx, authCanvas, authStars);
        drawStars(gameCtx, gameCanvas, gameStars);

        // Schedule the next frame
        requestAnimationFrame(draw);
      }

      window.addEventListener("resize", resizeStarsCanvas);
      window.addEventListener("orientationchange", resizeStarsCanvas);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", resizeStarsCanvas);
      }

      draw();
    </script>
    <script type="module">
      import * as net from "./common/network.js";
      import * as jwt from "./common/jwt.js";
      import { extractForm, setUser } from "./common/common.js";

      // Handle registration
      document.querySelector("#regForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const result = await net.send("/api/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(extractForm(e.target)),
        }, false);

        if (result.message) {
          const regFormMsg = document.querySelector("#regFormMsg");
          regFormMsg.className = "form-message " + (result.success ? "success" : "error");
          regFormMsg.textContent = result.message;
        }
      });

      // Handle login
      document.querySelector("#logForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const result = await net.send("/api/sessions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(extractForm(e.target)),
        }, false);

        if (result.message) {
          const logFormMsg = document.querySelector("#logFormMsg");
          logFormMsg.className = "form-message " + (result.success ? "success" : "error");
          logFormMsg.textContent = result.message;

          if (result.success) {
            // If we got a new access token, store it
            if (result.result?.access_token) {
              localStorage.setItem("access_token", result.result.access_token);
              localStorage.setItem(
                "access_token_decoded",
                JSON.stringify(jwt.decode(result.result.access_token))
              );
            }
            
            // Success means we're authenticated (either newly logged in or already logged in)
            document.getElementById("authContainer").classList.add("hidden");
            // Call setUser so window.VoidVanguard.user is set (including role) before the login event fires
            if (result.result?.access_token) {
              await setUser(jwt.decode(result.result.access_token), { origin: "login-form" });
            } else {
              document.dispatchEvent(new CustomEvent("login"));
            }
          }
        }
      });

      // This will be checked by App.js after it loads

      // Noww we handle regForm and logForm toggles
      document.querySelector("#logForm a").addEventListener("click", () => {
        const regForm = document.getElementById("regForm");
        const logForm = document.getElementById("logForm");
        const authContainer = document.getElementById("authContainer");

        if (regForm.style.display === "none" || regForm.style.display === "") {
          regForm.style.display = "flex";
          logForm.style.display = "none";
          authContainer.classList.add("reg-active");
        } else {
          regForm.style.display = "none";
          logForm.style.display = "flex";
          authContainer.classList.remove("reg-active");
        }
      });
      document.querySelector("#regForm a").addEventListener("click", () => {
        const regForm = document.getElementById("regForm");
        const logForm = document.getElementById("logForm");
        const authContainer = document.getElementById("authContainer");

        if (logForm.style.display === "none" || logForm.style.display === "") {
          logForm.style.display = "flex";
          regForm.style.display = "none";
          authContainer.classList.remove("reg-active");
        } else {
          logForm.style.display = "none";
          regForm.style.display = "flex";
          authContainer.classList.add("reg-active");
        }
      });

      // Elfelejtettem a jelszavam
      document.getElementById("forgotPasswordLink").addEventListener("click", () => {
        document.getElementById("logForm").style.display = "none";
        document.getElementById("forgotPasswordForm").style.display = "block";
      });
      document.getElementById("forgotPasswordForm").addEventListener("password-reset-back", () => {
        document.getElementById("forgotPasswordForm").style.display = "none";
        document.getElementById("logForm").style.display = "flex";
      });
    </script>
    <script type="module" src="./App.js"></script>
    <script type="module">

      import "/ui/component/validator/UsernameInputValidator.js"
      import "/ui/component/validator/PasswordInputValidator.js";
      import "/ui/component/validator/EmailInputValidator.js";
      import "/ui/component/auth/PasswordResetRequestForm.js";
      import "/ui/component/misc/UIVolumeController.js";
      import "/ui/component/game/GameVolumeController.js";
      import { onDOMContentLoaded } from "/common/common.js";
      import { attachGlobalAudioListeners } from "/common/globalAudio.js";
      attachGlobalAudioListeners();
      document.addEventListener("DOMContentLoaded", onDOMContentLoaded);
    </script>
  </body>
</html>
