<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/ui/style/global.css" />
    <link rel="stylesheet" href="/ui/style/profile.css" />
    <link rel="stylesheet" href="/ui/style/toasts.css" />
    <title>Profil</title>
  </head>
  <body>
    <div style="max-width: 600px; width: 100%">
      <search-bar base-url="/api/profiles?search={value}">
        <template>
          <collection-view items-source="profiles">
            <template>
              <div class="item" onclick="searchResultClickHandler(event)">
                <div
                  class="forClick"
                  data-bind="user_id"
                  bind-target="target"
                ></div>
                <img data-bind="avatar" bind-target="src" />
                <div data-bind="display_name"></div>
              </div>
            </template>
          </collection-view>
        </template>
      </search-bar>
    </div>

    <state-provider id="profile">
      <render-if when="user.id !== local.user_id">
        <h1>PROFIL</h1>
      </render-if>

      <render-if when="user.id === local.user_id" multistatesubscribe>
        <h1>PROFIL</h1>
      </render-if>

      <div class="profileHeader">
        <render-if when="!local.user_id" class="profileErrorContainer">
          <div class="profileError">
            <div subscribe-to="user_id">
              <h2>Profile not found!</h2>
            </div>
          </div>
        </render-if>

        <render-if when="local.user_id">
          <div id="profileContent">
            <img class="avatar" subscribe-to="avatar" subscribe-with="src" />

            <div>
              <div
                subscribe-to="display_name"
                subscribe-with="textContent"
              ></div>
              <div
                subscribe-to="description"
                subscribe-with="textContent"
              ></div>
            </div>
          </div>
        </render-if>

        <render-if when="local.user_id">
          <span subscribe-to="user_id"></span>
          <friendship-toggle
            refresh-target="#profile"
            response-target="toast-manager"
            subscribe
          ></friendship-toggle>
          <user-block-toggle
            refresh-target="#profile"
            response-target="toast-manager"
            subscribe
          ></user-block-toggle>
          <profile-form-toggle subscribe></profile-form-toggle>
        </render-if>
      </div>

      <div class="profileBody">
        <div></div>
        <div>
          <div class="friendListTitle">Barátlista</div>

          <div>
            <collection-view
              subscribe
              items-source="all_friends"
              class="friendList"
            >
              <template>
                <div class="item">
                  <img data-bind="avatar" bind-target="src" />
                  <span data-bind="name"></span>
                </div>
              </template>
            </collection-view>
          </div>
        </div>
      </div>

      <render-if
        id="createProfile"
        when="window.location.pathname.split('/').filter(Boolean)[1] === 'create'"
      >
        <fullscreen-overlay target="#createProfile">
          <profile-form action="create"></profile-form>
        </fullscreen-overlay>
      </render-if>

      <render-if
        id="modifyProfile"
        when="window.location.pathname.split('/').filter(Boolean)[1] === 'update'"
      >
        <fullscreen-overlay target="#modifyProfile">
          <profile-form action="update"></profile-form>
        </fullscreen-overlay>
      </render-if>

      <div class="footer">
        <div class="comments">
          <render-if when="user.id">
            <smart-form-wrapper
              url="/api/comments"
              method="POST"
              response-target="toast-manager"
              refresh-target="lazy-list"
            >
              <form>
                <input type="hidden" name="targetType" value="profile" />
                <input type="hidden" name="targetId" />
                <input-group
                  input-name="content"
                  label="Komment"
                  input-type="textarea"
                  input-placeholder="Komment..."
                ></input-group>
                <button>Közzététel</button>
              </form>
            </smart-form-wrapper>
          </render-if>

          <render-if when="local.user_id">
            <lazy-list page-size="1" mode="scroll" items-source="comments">
              <template>
                <div class="comment">
                  <state-provider>
                    <div class="header">
                      <div>
                        <img />
                        <span data-bind="author"></span>
                      </div>
                      <span data-bind="created_at"></span>
                    </div>
                    <div class="body">
                      <div data-bind="content"></div>
                    </div>

                    <div class="footer">
                      <render-if when="user.id === local.author_id">
                        <toggle-button target="#commentEditor">
                          <span>Szerkesztés</span>
                        </toggle-button>
                      </render-if>
                    </div>
                  </state-provider>
                </div>
              </template>
            </lazy-list>
          </render-if>
        </div>

        <div></div>
      </div>

      <fullscreen-overlay id="commentEditor" target="#commentEditor" hidden>
        <smart-form-wrapper>
          <form></form>
        </smart-form-wrapper>
      </fullscreen-overlay>
    </state-provider>

    <toast-manager></toast-manager>

    <script>
      function searchResultClickHandler(e) {
        document.querySelector("search-bar collection-view").hidden = true;
        document.querySelector("#profile").src =
          `/api/profiles/${e.target.target}`;
        document.querySelector("lazy-list").src =
          `/api/comments?targetId=${e.target.target}`;
        history.replaceState({}, "", "/profile/" + e.target.target);
      }
    </script>

    <script type="module" src="/ui/initcomponents.js"></script>
    <script type="module">
      import { onDOMContentLoaded } from "/common/common.js";
      document.addEventListener("DOMContentLoaded", onDOMContentLoaded);
      const profileId = window.location.pathname.split("/").filter(Boolean)[1];
      document.querySelector("#profile").src = "/api/profiles/" + profileId;
      document.querySelector("lazy-list").src =
        "/api/comments?targetId=" + profileId;
    </script>
  </body>
</html>
