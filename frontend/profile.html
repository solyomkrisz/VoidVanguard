<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil</title>
    <style>
      body {
        background: #333;
      }
    </style>
  </head>
  <body>
    <profile-container>
      <profile-header></profile-header>
    </profile-container>

    <profile-form action="update"></profile-form>

    <smart-form-wrapper
      url="/api/profiles"
      method="PATCH"
      target="profile-form"
    >
      <form>
        <input-group
          input-type="text"
          input-placeholder="Profilnév"
          label="Profilnév"
          name="displayName"
        ></input-group>
        <button type="submit">Módosítások mentése</button>
      </form>
    </smart-form-wrapper>

    <script type="module" src="/ui/initcomponents.js"></script>
    <script type="module">
      import { onDOMContentLoaded } from "/common/common.js";
      document.addEventListener("DOMContentLoaded", onDOMContentLoaded);
    </script>
  </body>
</html>
