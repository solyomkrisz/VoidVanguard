<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/ui/style/global.css" />
    <link rel="stylesheet" href="/ui/style/profile.css" />
    <link rel="stylesheet" href="/ui/style/toasts.css" />
    <title>Profil</title>
  </head>
  <body>
    <div style="max-width: 600px; width: 100%">
      <search-bar base-url="/api/profiles?search={value}">
        <template>
          <collection-view items-source="profiles">
            <template>
              <div class="item" onclick="searchResultClickHandler(event)">
                <div
                  class="forClick"
                  data-bind="user_id"
                  bind-target="target"
                ></div>
                <img data-bind="avatar" bind-target="src" />
                <div data-bind="display_name"></div>
              </div>
            </template>
          </collection-view>
        </template>
      </search-bar>
    </div>

    <remote-state-provider id="profile">
      <render-if when="user.id !== local.user_id">
        <h1>PROFIL</h1>
      </render-if>

      <render-if when="user.id === local.user_id" multistatesubscribe>
        <h1>PROFIL</h1>
      </render-if>

      <div class="profileHeader">
        <render-if when="!local.user_id" class="profileErrorContainer">
          <div class="profileError">
            <div subscribe-to="user_id">
              <h2>Profile not found!</h2>
            </div>
          </div>
        </render-if>

        <render-if when="local.user_id">
          <div id="profileContent">
            <img class="avatar" subscribe-to="avatar" subscribe-with="src" />

            <div>
              <div
                subscribe-to="display_name"
                subscribe-with="textContent"
              ></div>
              <div
                subscribe-to="description"
                subscribe-with="textContent"
              ></div>
            </div>
          </div>
        </render-if>

        <render-if when="local.user_id">
          <span subscribe-to="user_id"></span>
          <friendship-toggle
            refresh-target="#profile"
            response-target="toast-manager"
            subscribe
          ></friendship-toggle>
          <user-block-toggle
            refresh-target="#profile"
            response-target="toast-manager"
            subscribe
          ></user-block-toggle>
          <profile-form-toggle subscribe></profile-form-toggle>
        </render-if>
      </div>

      <div class="profileBody">
        <div></div>
        <div>
          <div class="friendListTitle">Barátlista</div>

          <div>
            <collection-view
              subscribe
              items-source="all_friends"
              class="friendList"
            >
              <template>
                <div class="item">
                  <img data-bind="avatar" bind-target="src" />
                  <span data-bind="name"></span>
                </div>
              </template>
            </collection-view>
          </div>
        </div>
      </div>

      <render-if
        id="createProfile"
        when="window.location.pathname.split('/').filter(Boolean)[1] === 'create'"
      >
        <fullscreen-overlay target="#createProfile">
          <profile-form action="create"></profile-form>
        </fullscreen-overlay>
      </render-if>

      <render-if
        id="modifyProfile"
        when="window.location.pathname.split('/').filter(Boolean)[1] === 'update'"
      >
        <fullscreen-overlay target="#modifyProfile">
          <profile-form action="update"></profile-form>
        </fullscreen-overlay>
      </render-if>
    </remote-state-provider>

    <toast-manager></toast-manager>

    <script>
      function searchResultClickHandler(e) {
        document.querySelector("search-bar collection-view").hidden = true;
        document.querySelector("#profile").src =
          `/api/profiles/${e.target.target}`;
        history.replaceState({}, "", "/profile/" + e.target.target);
      }
    </script>

    <script type="module" src="/ui/initcomponents.js"></script>
    <script type="module">
      import { onDOMContentLoaded } from "/common/common.js";
      document.addEventListener("DOMContentLoaded", onDOMContentLoaded);
      document.querySelector("#profile").src =
        "/api/profiles/" +
        window.location.pathname.split("/").filter(Boolean)[1];
    </script>
  </body>
</html>
